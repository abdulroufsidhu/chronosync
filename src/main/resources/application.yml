spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: chronosync
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:chronosync}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
#    tls: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${SMTP_HOST:smtp.gmail.com}

server:
  port: ${APP_PORT:8080}
  address: ${APP_HOST:0.0.0.0}

jwt:
  secret: ${JWT_SECRET:chronosync-jwt-secret-key-for-authentication-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  email-from: ${EMAIL_FROM:noreply@chronosync.com}

logging:
  level:
    com.chronosync: DEBUG
    org.springframework.security: DEBUG
