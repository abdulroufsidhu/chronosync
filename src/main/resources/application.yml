spring:
  application:
    name: chronosync
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:chronosync}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${APP_PORT:8080}
  address: ${APP_HOST:0.0.0.0}

jwt:
  secret: ${JWT_SECRET:chronosync-jwt-secret-key-for-authentication-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.chronosync: DEBUG
    org.springframework.security: DEBUG
